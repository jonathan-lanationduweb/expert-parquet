#
# Pose Parquet - WordPress de developpement (backend du site pose-parquet.com).
# Ajoute le 7 septembre 2026. Local uniquement : Require local.
<VirtualHost *:80>
  ServerName pose-parquet-dev.local
  DocumentRoot "${INSTALL_DIR}/www/pose-parquet-dev"
  <Directory "${INSTALL_DIR}/www/pose-parquet-dev/">
    Options +Indexes +Includes +FollowSymLinks +MultiViews
    AllowOverride All
    Require local
  </Directory>
  ErrorLog "logs/pose-parquet-dev-error.log"
  CustomLog "logs/pose-parquet-dev-access.log" common
</VirtualHost>

# ==========================================================================
# Expert Parquet — front statique
# Sert directement le dossier du generateur. Aucun PHP, aucun WordPress ici :
# le site livre est du HTML statique, et il doit le rester.
# ==========================================================================
<VirtualHost *:80>
  ServerName expert-parquet.test
  DocumentRoot "c:/Users/jonat/Desktop/expert-parquet.com"

  # Le backend WordPress et les donnees privees vivent DANS ce dossier depuis
  # le regroupement du projet, mais ne font pas partie du site. Trois barrieres
  # independantes, parce qu'une seule qui saute expose des photographies de
  # domiciles et des identifiants :
  #
  #   1. RedirectMatch : la requete est refusee sur l'URL, avant tout mappage
  #      vers un fichier. 404 et non 403 : inutile de confirmer l'existence.
  #   2. <Directory> Require all denied : meme si la regle d'URL saute.
  #   3. AllowOverride None sur ces arbres : aucun .htaccess place la ne peut
  #      re-autoriser quoi que ce soit.
  # (?i) : Windows ne distingue pas la casse des chemins, la regle ne doit
  # pas le faire non plus — sans quoi /BACKEND/ contournerait cette
  # premiere barriere et ne dependrait plus que de la seconde.
  RedirectMatch 404 "(?i)^/backend(-private)?(/|$)"

  <Directory "c:/Users/jonat/Desktop/expert-parquet.com/backend">
    AllowOverride None
    Options -Indexes -FollowSymLinks
    Require all denied
  </Directory>
  <Directory "c:/Users/jonat/Desktop/expert-parquet.com/backend-private">
    AllowOverride None
    Options -Indexes -FollowSymLinks
    Require all denied
  </Directory>

  <Directory "c:/Users/jonat/Desktop/expert-parquet.com/">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require local
  </Directory>
</VirtualHost>

# ==========================================================================
# Expert Parquet — API et administration (WordPress)
# Ne sert aucune page publique : uniquement /wp-json/expert-parquet/v1/* et
# /wp-admin. La racine est backend/public ; le stockage des photographies
# (backend-private) est un dossier FRERE, donc hors de cette racine.
# ==========================================================================
<VirtualHost *:80>
  ServerName api.expert-parquet.test
  DocumentRoot "c:/Users/jonat/Desktop/expert-parquet.com/backend/public"
  DirectoryIndex index.php index.html
  <Directory "c:/Users/jonat/Desktop/expert-parquet.com/backend/public/">
    Options -Indexes +FollowSymLinks
    # AllowOverride All : le .htaccess de WordPress porte les regles de
    # reecriture (/wp-json/...) et la fermeture des fichiers de documentation.
    AllowOverride All
    Require local
  </Directory>
</VirtualHost>
