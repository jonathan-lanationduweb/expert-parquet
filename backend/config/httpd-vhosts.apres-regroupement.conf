# Copie de reference de la configuration Apache d'Expert Parquet.
#
# Ce fichier n'est PAS lu par Apache : il documente, dans le depot, ce que
# contient httpd-vhosts.conf sur le poste de developpement. Le fichier vivant
# est C:/wamp64/bin/apache/<version>/conf/extra/httpd-vhosts.conf.
#
# 29/09/2026 : les deux hotes locaux (expert-parquet-dev.local et
# api.expert-parquet-dev.local) sont remplaces par UN SEUL hote. WordPress
# n'est pas deplace : il est atteint par des alias.

# ==========================================================================
# Expert Parquet — un seul hote local : expert-parquet-dev.local
#
# Le site est du HTML statique servi depuis la racine du projet. WordPress vit
# dans backend/public et n'est PAS deplace : seuls les chemins dont
# l'administration et l'API ont besoin y sont routes par des alias.
#
# Pourquoi des alias plutot qu'un second VirtualHost `api.` :
#   - une seule adresse a retenir, et l'admin s'ouvre bien sur
#     http://expert-parquet-dev.local/wp-admin/index.php ;
#   - front et API deviennent de meme origine, donc plus de preflight CORS en
#     local — la liste blanche reste en place pour la production.
#
# Pourquoi des alias plutot qu'un RewriteRule generique : un alias enumere ce
# qui est servi. Une reecriture large exposerait tout backend/public des qu'un
# chemin inattendu y ressemblerait.
# ==========================================================================
<VirtualHost *:80>
  ServerName expert-parquet-dev.local
  DocumentRoot "c:/Users/jonat/Desktop/expert-parquet.com"
  DirectoryIndex index.php index.html

  # --- Ce qui n'est JAMAIS servi -----------------------------------------
  #
  # Le backend WordPress et les donnees privees vivent DANS le dossier du site
  # depuis le regroupement du projet, mais ne font pas partie du site. Trois
  # barrieres independantes, parce qu'une seule qui saute expose des
  # photographies de domiciles et des identifiants :
  #
  #   1. RedirectMatch : la requete est refusee sur l'URL, avant tout mappage
  #      vers un fichier. 404 et non 403 : inutile de confirmer l'existence.
  #   2. <Directory> Require all denied : meme si la regle d'URL saute.
  #   3. AllowOverride None sur ces arbres : aucun .htaccess place la ne peut
  #      re-autoriser quoi que ce soit.
  #
  # Les alias plus bas ne contredisent PAS cette regle : ils exposent des
  # chemins d'URL (/wp-admin, /wp-json...) et jamais le chemin physique
  # /backend/public, qui reste refuse.
  #
  # (?i) : Windows ne distingue pas la casse des chemins, la regle ne doit pas
  # le faire non plus — sans quoi /BACKEND/ contournerait cette premiere
  # barriere et ne dependrait plus que de la seconde.
  RedirectMatch 404 "(?i)^/backend(-private)?(/|$)"

  # Segments masques : jamais servis.
  #
  # Le site n'en publie aucun, mais le projet en contient : `.git` (l'historique
  # complet, donc le depot reconstituable) et ce que les outils tiers deposent
  # dans le dossier — un worktree Git obsolete sous `.kilo/` a servi une copie
  # perimee du site en 200.
  #
  # La regle porte sur la convention plutot que sur une liste de noms : un
  # segment commencant par un point est de l'outillage, jamais du contenu
  # publie. Nommer `.kilo` n'aurait protege que de cet outil-la.
  # `.well-known` reste autorise : validation de certificat.
  RedirectMatch 404 "(?i)(^|/)\.(?!well-known(/|$))"

  <DirectoryMatch "/\.(?!well-known)[^/]+">
    AllowOverride None
    Options -Indexes -FollowSymLinks
    Require all denied
  </DirectoryMatch>

  # --- WordPress : uniquement ce dont l'admin et l'API ont besoin ---------
  #
  # `xmlrpc.php` n'est volontairement PAS alias : il n'a aucun usage ici et
  # repond donc 404 avant meme d'atteindre PHP, en plus du 403 pose par
  # EP_Security.
  Alias "/wp-admin"    "c:/Users/jonat/Desktop/expert-parquet.com/backend/public/wp-admin"
  Alias "/wp-includes" "c:/Users/jonat/Desktop/expert-parquet.com/backend/public/wp-includes"
  Alias "/wp-content"  "c:/Users/jonat/Desktop/expert-parquet.com/backend/public/wp-content"

  AliasMatch "^/(wp-login\.php|wp-cron\.php|wp-activate\.php|wp-signup\.php)$" "c:/Users/jonat/Desktop/expert-parquet.com/backend/public/$1"

  # L'API passe par l'amorce de WordPress, qui lit REQUEST_URI et retrouve la
  # route REST par ses propres regles de reecriture. L'expression consomme
  # l'URL entiere : aucun PATH_INFO residuel a gerer.
  AliasMatch "^/wp-json(?:/.*)?$" "c:/Users/jonat/Desktop/expert-parquet.com/backend/public/index.php"

  # --- Barriere 2 : le systeme de fichiers -------------------------------
  <Directory "c:/Users/jonat/Desktop/expert-parquet.com/backend">
    AllowOverride None
    Options -Indexes -FollowSymLinks
    Require all denied
  </Directory>
  <Directory "c:/Users/jonat/Desktop/expert-parquet.com/backend-private">
    AllowOverride None
    Options -Indexes -FollowSymLinks
    Require all denied
  </Directory>

  # Seule exception, plus specifique donc prioritaire : backend/public, que les
  # alias ci-dessus rendent atteignable. `AllowOverride None` : le .htaccess de
  # WordPress porte un `RewriteBase /` calibre pour une racine dediee, il
  # renverrait ici vers la racine du site statique. Ses protections sont donc
  # reecrites explicitement ci-dessous plutot que heritees.
  <Directory "c:/Users/jonat/Desktop/expert-parquet.com/backend/public">
    AllowOverride None
    Options -Indexes +FollowSymLinks
    Require local

    # Identifiants de base, sels, documentation, journaux et sauvegardes :
    # rien de tout cela n'a a sortir, meme par un alias.
    <FilesMatch "^(wp-config.*\.php|readme\.html|license\.txt|\.htaccess|.*\.(md|log|bak|orig|sql|ini))$">
      Require all denied
    </FilesMatch>
  </Directory>

  # Reinstaller WordPress par le navigateur : jamais.
  <Directory "c:/Users/jonat/Desktop/expert-parquet.com/backend/public/wp-admin">
    <Files "install.php">
      Require all denied
    </Files>
    <Files "setup-config.php">
      Require all denied
    </Files>
  </Directory>

  # Les televersements de WordPress ne servent a rien ici : les photographies
  # des demandes vont dans backend-private, hors racine web.
  <Directory "c:/Users/jonat/Desktop/expert-parquet.com/backend/public/wp-content/uploads">
    Require all denied
  </Directory>

  # --- Le site statique ---------------------------------------------------
  <Directory "c:/Users/jonat/Desktop/expert-parquet.com/">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require local
  </Directory>
</VirtualHost>
